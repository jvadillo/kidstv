# nginx dentro del contenedor "web". Delante está el Caddy compartido del VPS (TLS).
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    server_tokens off;
    charset utf-8;

    # Fragmentos de subida de 8 MB + margen.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;

    # App de TV (estática). Se revalida siempre para que las actualizaciones lleguen sin reinstalar.
    location ^~ /tv/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html /index.php?$query_string;
    }

    # Aplicación instalable (PWA): el service worker y los manifiestos se revalidan siempre.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Exacta: el bloque ^~ /tv/ impediría que una expresión regular la alcanzase.
    location = /tv/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ^~ /tv-bridge/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /avatars/ {
        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Recursos del panel (llevan ?v=<fecha> en la URL).
    location ~* \.(?:css|js|svg|png|ico|webp|jpg|jpeg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos privados: solo accesibles mediante X-Accel-Redirect emitido por Laravel
    # tras comprobar permisos. nginx gestiona Range (avanzar/retroceder en vídeos).
    location ^~ /_protected/ {
        internal;
        alias /var/www/html/storage/app/private/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ \.php$ {
        try_files /index.php =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_request_buffering on;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
