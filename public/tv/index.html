<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>NokoPlay</title>
    <meta name="application-name" content="NokoPlay">
    <link rel="icon" href="img/icon.png" type="image/png">
    <!-- Aplicación instalable en móviles, tabletas y ordenadores (las teles lo ignoran). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#15133a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NokoPlay TV">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tv.css">
</head>
<body>
    <div id="app" class="app" aria-live="polite">
        <div class="boot">
            <div class="boot-brand"><img src="img/logo-vertical.png" alt="NokoPlay" width="284" height="230"></div>
        </div>
    </div>
    <div id="overlay" class="overlay hidden" role="alertdialog" aria-live="assertive"></div>

    <script src="config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/core.js"></script>
    <script src="js/players.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
